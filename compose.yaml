name: adrian-ding-portal

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: adrian_ding_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
